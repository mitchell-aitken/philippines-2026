<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Philippines 2026 · Trip Map</title>
<meta name="description" content="Map of a Nov 13 – Dec 1, 2026 trip: the Chocolate Hills on Bohol, El Nido and Coron.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{
    --blue:#0038A8; --red:#CE1126; --gold:#FCD116;
    --ink:#0B0B0C; --ink-2:#3A3A3F; --muted:#76767C; --line:#E8E8EB; --soft:#F5F5F6;
    --sans:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --shadow:0 2px 6px rgba(0,0,0,.06),0 10px 30px rgba(0,0,0,.10);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#E9EBEE;color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
  a{color:inherit}
  button{font:inherit;color:inherit;cursor:pointer}
  :focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  #map{position:fixed;inset:0;background:#E9EBEE}

  /* ---------- floating title card ---------- */
  .card{position:fixed;z-index:1000;top:calc(16px + env(safe-area-inset-top,0px));left:16px;background:#fff;border-radius:14px;box-shadow:var(--shadow);overflow:hidden;max-width:min(380px,calc(100vw - 32px))}
  .flag{height:4px;display:grid;grid-template-columns:1fr 1fr}
  .flag i:first-child{background:var(--blue)} .flag i:last-child{background:var(--red)}
  .card-body{padding:14px 16px 14px}
  .brand{display:flex;align-items:center;gap:12px}
  .sun{width:28px;height:28px;flex:0 0 auto}
  .brand h1{margin:0;font-size:19px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
  .brand p{margin:3px 0 0;font:500 10.5px/1.3 var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
  .actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:500;text-decoration:none;border:1px solid var(--line);background:#fff;transition:background .15s,border-color .15s}
  .btn:hover{border-color:var(--ink)}
  .btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
  .btn.primary:hover{background:#2a2a2e}

  /* ---------- legend ---------- */
  .legend{position:fixed;z-index:1000;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:#fff;border-radius:10px;padding:8px 12px;display:flex;flex-wrap:wrap;gap:6px 14px;font:500 11px/1.2 var(--mono);color:var(--ink-2);box-shadow:var(--shadow);max-width:calc(100vw - 90px);transition:opacity .2s}
  .legend span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  .legend .dot{width:10px;height:10px;border-radius:50%}
  .legend .ln{width:22px;border-top:2px solid var(--ink)}
  .legend .ln.d{border-top-style:dashed}
  body.popup-open .legend{opacity:0;pointer-events:none}

  /* ---------- pins ---------- */
  .pin{width:30px;height:30px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font:600 12.5px/1 var(--sans);font-variant-numeric:tabular-nums;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.25),0 4px 12px rgba(0,0,0,.14);transition:transform .15s ease}
  .pin:hover{transform:scale(1.1)}
  .pin.active{transform:scale(1.22);box-shadow:0 0 0 3px var(--gold),0 4px 14px rgba(0,0,0,.25)}
  .leaflet-marker-icon.on-top{z-index:9999!important}
  .leaflet-tooltip{font:500 12px/1.3 var(--sans);border-radius:8px;border:0;box-shadow:var(--shadow);padding:6px 9px}

  /* ---------- popup ---------- */
  .leaflet-popup-content-wrapper{border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.2);padding:0}
  .leaflet-popup-content{margin:0;width:min(340px,78vw)!important;font:14px/1.5 var(--sans)}
  .leaflet-container a.leaflet-popup-close-button{top:10px;right:10px;width:26px;height:26px;font-size:20px;color:var(--muted)}
  .pop{padding:16px 18px;max-height:min(460px,60vh);overflow:auto}
  .eyebrow{font:500 10.5px/1.3 var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);display:flex;align-items:center;gap:8px;padding-right:26px}
  .eyebrow i{width:8px;height:8px;border-radius:50%;background:var(--c);display:inline-block}
  .pop h3{margin:6px 0;font-size:18px;font-weight:600;letter-spacing:-.015em;line-height:1.25}
  .pop p{margin:0 0 10px;color:var(--ink-2);font-size:13.5px}
  .pop ul{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:6px}
  .pop li{display:grid;grid-template-columns:74px 1fr;gap:8px;font-size:13px}
  .pop li span{font:500 10px/1.7 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .facts{border-top:1px solid var(--line);padding-top:10px;margin-bottom:12px;display:grid;gap:8px;font-size:12.5px;color:var(--ink-2)}
  .facts b{font:500 10px/1 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:block;margin-bottom:3px}
  .pop .tip{font-size:12.5px;color:var(--ink-2);padding-left:10px;border-left:2px solid var(--gold);margin:0 0 12px}
  .pop .more{display:inline-block;margin-top:12px;font-size:13px;font-weight:500;color:var(--blue);text-decoration:none}
  .pop .more:hover{text-decoration:underline}

  .photos{display:flex;flex-wrap:wrap;gap:6px}
  .photos a{display:inline-flex;align-items:center;gap:6px;padding:5px 10px 5px 8px;border:1px solid var(--line);border-radius:999px;text-decoration:none;font-size:12.5px;font-weight:500;color:var(--ink);background:#fff}
  .photos a svg{width:14px;height:14px;color:var(--muted)}
  .photos a:hover{border-color:var(--ink);background:var(--soft)}

  .leaflet-control-attribution{font-size:10px}
  @media (max-width:600px){
    .card{left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));max-width:none}
    .card-body{padding:12px 14px}
    .legend{left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));font-size:10px;gap:4px 10px;padding:6px 10px}
    .pop{max-height:46svh}
  }

  /* ---------- Philippine theme ---------- */
  .ph-flag{width:42px;height:21px;flex:0 0 auto;border-radius:3px;box-shadow:0 0 0 1px rgba(0,0,0,.08),0 2px 6px rgba(0,56,168,.25)}
  .nav3{display:inline-flex;gap:4px;padding:4px;border-radius:999px;background:#EEF2FB;border:1px solid #DCE4F5}
  .nav3 a{padding:7px 14px;border-radius:999px;font-size:13px;font-weight:500;color:#26324D;text-decoration:none;white-space:nowrap;transition:background .15s,color .15s}
  .nav3 a:hover{background:#fff;color:var(--blue)}
  .nav3 a[aria-current="page"]{background:var(--blue);color:#fff;box-shadow:0 2px 8px rgba(0,56,168,.35)}
  header .flag{height:5px;grid-template-columns:2fr 1fr 2fr}
  header .flag::before{content:"";background:var(--blue)}
  header .flag i:first-child{background:var(--gold)} header .flag i:last-child{background:var(--red)}
  .card .flag{height:5px;grid-template-columns:2fr 1fr 2fr}
  .card .flag::before{content:"";background:var(--blue)}
  .card .flag i:first-child{background:var(--gold)} .card .flag i:last-child{background:var(--red)}
  .card{border:1px solid #DCE4F5}
  .card .actions{align-items:center}
  .card .ph-flag{width:46px;height:23px}
  @media (max-width:600px){.nav3 a{padding:6px 10px;font-size:12px}}
  .card .nav3{flex:1 1 auto}
  .card .nav3 a{flex:1;text-align:center}
</style>
</head>
<body>

<div id="map" role="region" aria-label="Trip map"></div>

<div class="card">
  <div class="flag" aria-hidden="true"><i></i><i></i></div>
  <div class="card-body">
    <div class="brand">
      <svg class="ph-flag" viewBox="0 0 1200 600" role="img" aria-label="Flag of the Philippines"><rect width="1200" height="300" fill="#0038A8"/><rect y="300" width="1200" height="300" fill="#CE1126"/><path d="M0 0L519.6 300L0 600Z" fill="#FFF"/><g fill="#FCD116"><circle cx="180" cy="300" r="46"/><path d="M171.0,250.8L169.6,220.7L176.0,250.2ZM177.5,250.1L180.0,204.0L182.5,250.1ZM184.0,250.2L190.4,220.7L189.0,250.8ZM208.5,258.9L228.8,236.6L212.4,261.9ZM213.5,262.9L247.9,232.1L217.1,266.5ZM218.1,267.6L243.4,251.2L221.1,271.5ZM229.2,291.0L259.3,289.6L229.8,296.0ZM229.9,297.5L276.0,300.0L229.9,302.5ZM229.8,304.0L259.3,310.4L229.2,309.0ZM221.1,328.5L243.4,348.8L218.1,332.4ZM217.1,333.5L247.9,367.9L213.5,337.1ZM212.4,338.1L228.8,363.4L208.5,341.1ZM189.0,349.2L190.4,379.3L184.0,349.8ZM182.5,349.9L180.0,396.0L177.5,349.9ZM176.0,349.8L169.6,379.3L171.0,349.2ZM151.5,341.1L131.2,363.4L147.6,338.1ZM146.5,337.1L112.1,367.9L142.9,333.5ZM141.9,332.4L116.6,348.8L138.9,328.5ZM130.8,309.0L100.7,310.4L130.2,304.0ZM130.1,302.5L84.0,300.0L130.1,297.5ZM130.2,296.0L100.7,289.6L130.8,291.0ZM138.9,271.5L116.6,251.2L141.9,267.6ZM142.9,266.5L112.1,232.1L146.5,262.9ZM147.6,261.9L131.2,236.6L151.5,258.9Z"/><path d="M52.0,28.0L58.7,48.7L80.5,48.7L62.9,61.5L69.6,82.3L52.0,69.5L34.4,82.3L41.1,61.5L23.5,48.7L45.3,48.7Z"/><path d="M52.0,512.0L58.7,532.7L80.5,532.7L62.9,545.5L69.6,566.3L52.0,553.5L34.4,566.3L41.1,545.5L23.5,532.7L45.3,532.7Z"/><path d="M455.0,270.0L461.7,290.7L483.5,290.7L465.9,303.5L472.6,324.3L455.0,311.5L437.4,324.3L444.1,303.5L426.5,290.7L448.3,290.7Z"/></g></svg>
      <div>
        <h1>Philippines 2026</h1>
        <p>Nov 13 – Dec 1 · Bohol 5 · El Nido 5 · Coron 6 nights</p>
      </div>
    </div>
    <div class="actions">
      <nav class="nav3" aria-label="Pages"><a href="index.html" aria-current="page">Map</a><a href="itinerary.html">Itinerary</a><a href="flights.html">Flights &amp; costs</a></nav>
      <button class="btn" id="overview" type="button">Whole trip</button>
    </div>
  </div>
</div>

<div class="legend" aria-hidden="true">
  <span><i class="dot" style="background:var(--blue)"></i>Palawan</span>
  <span><i class="dot" style="background:var(--red)"></i>Bohol</span>
  <span><i class="dot" style="background:var(--ink)"></i>Cebu</span>
  <span><i class="ln d"></i>Flight</span>
  <span><i class="ln"></i>Ferry / road</span>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
  if (!window.L) document.write('<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"><script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"><\/script>');
</script>
<script>document.write('<script src="trip-data.js?v=' + Date.now() + '"><\/script>');</script>
<script>
/* ---------- basemap: Esri Light Gray Canvas (no API key), OSM as fallback ---------- */
const map = L.map("map", { zoomControl: false });
L.control.zoom({ position: "bottomright" }).addTo(map);

const esriBase = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}", {
  maxZoom: 18, maxNativeZoom: 16,
  attribution: 'Tiles &copy; <a href="https://www.esri.com/">Esri</a>, HERE, Garmin, &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);
const esriLabels = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}", {
  maxZoom: 18, maxNativeZoom: 16, pane: "overlayPane"
}).addTo(map);

let tileErrors = 0, switched = false;
esriBase.on("tileerror", () => {
  if (switched || ++tileErrors < 6) return;
  switched = true;
  map.removeLayer(esriBase); map.removeLayer(esriLabels);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);
});

/* ---------- route lines ---------- */
function arc(a, b, bend = 0.18, n = 40) {
  const [la1, lo1] = a, [la2, lo2] = b;
  const cl = (la1 + la2) / 2 - (lo2 - lo1) * bend, co = (lo1 + lo2) / 2 + (la2 - la1) * bend;
  const out = [];
  for (let i = 0; i <= n; i++) { const t = i / n, u = 1 - t; out.push([u*u*la1 + 2*u*t*cl + t*t*la2, u*u*lo1 + 2*u*t*co + t*t*lo2]); }
  return out;
}
ROUTE.forEach(r => {
  if (r.mode === "fly") L.polyline(arc(r.pts[0], r.pts[1]), { color: "#0B0B0C", weight: 1.6, opacity: .7, dashArray: "4 7", interactive: false }).addTo(map);
  else L.polyline(r.pts, { color: "#0B0B0C", weight: 2, opacity: .75, interactive: false }).addTo(map);
});

/* ---------- day pins ---------- */
const markers = {};
let activeDay = null;
const pinned = DAYS.filter(d => d.pin);
const allBounds = L.latLngBounds(pinned.map(d => d.pin));

function popupHTML(d) {
  return `<div class="pop" style="--c:${COLORS[d.region]}">
    <div class="eyebrow"><i></i>Day ${dayNum(d)} · ${d.dow} ${d.mon || MONTH} ${d.date} · ${esc(d.region)}</div>
    <h3>${esc(d.title)}</h3>
    ${d.lede ? `<p>${esc(d.lede)}</p>` : ""}
    <ul>${d.plan.map(([w, t]) => `<li><span>${esc(w)}</span>${esc(t)}</li>`).join("")}</ul>
    <div class="facts">
      <div><b>Getting around</b>${esc(d.move)}</div>
      <div><b>Sleeping</b>${esc(stayText(d.stay))}</div>
    </div>
    ${d.tip ? `<p class="tip">${esc(d.tip)}</p>` : ""}
    ${photosHTML(d)}
    <a class="more" href="itinerary.html#day-${d.date}">Read in full itinerary →</a>
  </div>`;
}

function setActive(date) {
  if (activeDay !== null && markers[activeDay]) {
    const el = markers[activeDay].getElement();
    el?.classList.remove("on-top"); el?.querySelector(".pin")?.classList.remove("active");
  }
  activeDay = date;
  if (date !== null && markers[date]) {
    const el = markers[date].getElement();
    el?.classList.add("on-top"); el?.querySelector(".pin")?.classList.add("active");
  }
}

pinned.forEach(d => {
  const icon = L.divIcon({ className: "", html: `<div class="pin" style="--c:${COLORS[d.region]}">${d.date}</div>`, iconSize: [30, 30], iconAnchor: [15, 15], popupAnchor: [0, -16] });
  const m = L.marker(d.pin, { icon, title: `${d.mon || MONTH} ${d.date}: ${d.title}`, riseOnHover: true }).addTo(map);
  m.bindPopup(popupHTML(d), { maxWidth: 360, autoPanPaddingTopLeft: [20, 150], autoPanPaddingBottomRight: [20, 20] });
  m.bindTooltip(`${d.mon || MONTH} ${d.date} · ${esc(d.title)}`, { direction: "top", offset: [0, -16] });
  m.on("popupopen", () => { m.closeTooltip(); setActive(d.date); document.body.classList.add("popup-open"); history.replaceState(null, "", "#day-" + d.date); });
  m.on("popupclose", () => { if (activeDay === d.date) { setActive(null); document.body.classList.remove("popup-open"); history.replaceState(null, "", location.pathname); } });
  markers[d.date] = m;
});

const pad = () => window.innerWidth < 600 ? { paddingTopLeft: [30, 170], paddingBottomRight: [30, 60] } : { paddingTopLeft: [420, 60], paddingBottomRight: [60, 60] };
map.fitBounds(allBounds, pad());
document.getElementById("overview").addEventListener("click", () => { map.closePopup(); map.flyToBounds(allBounds, { ...pad(), duration: 0.8 }); });

/* open a day from the URL, e.g. index.html#day-25 */
function openFromHash() {
  const m = /^#day-(\d+)$/.exec(location.hash);
  const mk = m && markers[+m[1]];
  if (!mk) return;
  map.setView(mk.getLatLng(), 11);
  setTimeout(() => mk.openPopup(), 150);
}
openFromHash();
</script>
</body>
</html>
