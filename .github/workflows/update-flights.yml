name: Update flight prices

on:
  schedule:
    - cron: "17 13 */2 * *"   # every other day, about 7:17 am in Calgary (8 searches per run)
  workflow_dispatch:         # "Run workflow" button for an instant refresh

permissions:
  contents: write

concurrency:
  group: update-flights
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch prices
        run: node scripts/fetch-flights.mjs
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/flights.json
          if git diff --cached --quiet; then
            echo "No price changes."
          else
            git commit -m "Update flight prices ($(date -u +%Y-%m-%d))"
            git push
          fi
